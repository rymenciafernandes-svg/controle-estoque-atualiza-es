<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhes do Cliente</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0d14; color: #f1f5f9; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 16px; margin-bottom: 20px; }
  .title { font-size: 20px; font-weight: 800; color: #38bdf8; }
  .info-row { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); background: rgba(0,0,0,0.2); margin-bottom: 6px; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
  .info-label { font-size: 10px; color: #94a3b8; font-weight: 800; text-transform: uppercase; }
  .info-value { font-size: 15px; font-weight: 600; color: #fff; }
  .loading { text-align: center; color: #94a3b8; font-size: 14px; margin: 40px 0; }
  .btn-fechar { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title" id="nome-cliente">Carregando Cliente...</div>
    <button class="btn-fechar" onclick="window.close()">Fechar</button>
  </div>
  <div id="loading" class="loading">Buscando informações na planilha... aguarde.</div>
  <div id="dados-container"></div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const clienteId = urlParams.get('id') || urlParams.get('nome');
  const clienteNome = urlParams.get('nome');
  
  if (clienteNome) document.getElementById('nome-cliente').textContent = clienteNome;

  const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw0kiPQtjbWtuawHsjjAZ84Plg1JhL-bIa21VDuciaAn9ZT8vCwCq7wN3cXffbQ0Sw5/exec";

  fetch(GOOGLE_WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'getDetalhesCliente', args: [clienteId] })
  })
  .then(res => res.json())
  .then(res => {
    document.getElementById('loading').style.display = 'none';
    const container = document.getElementById('dados-container');
    
    if (res.sucesso && res.dados && res.dados.length > 0) {
      let html = '';
      res.dados.forEach((dado, index) => {
        html += `<div class="info-row"><span class="info-label">Informação Registrada</span><span class="info-value">${dado}</span></div>`;
      });
      container.innerHTML = html;
    } else {
      container.innerHTML = `<div class="loading">${res.mensagem || 'Nenhum detalhe extra encontrado.'}</div>`;
    }
  })
  .catch(err => {
    document.getElementById('loading').textContent = 'Erro ao se comunicar com o banco de dados.';
  });
</script>
</body>
</html>
